server {
    listen 80;
    server_name _;
    client_max_body_size 72M;
    root /var/www/html/public;
    index index.php;

    location ^~ /storage/ { alias /var/www/html/storage/app/public/; expires 30d; add_header Cache-Control "public"; }
    # Статика з public/; файли, яких там немає (наприклад /livewire/livewire.js), віддає Laravel
    location ~* \.(css|js|svg|png|jpg|woff2?)$ { expires 7d; add_header Cache-Control "public"; try_files $uri /index.php?$query_string; }
    location / { try_files $uri /index.php?$query_string; }
    location = /index.php {
        fastcgi_pass edu-app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_read_timeout 300;
    }
    # Білди APK/OBB для окулярів: Laravel перевіряє підписане посилання і віддає X-Accel-Redirect сюди
    location ^~ /_builds/ { internal; alias /var/www/html/storage/app/builds/; }
    location ~ \.php$ { return 404; }
}
