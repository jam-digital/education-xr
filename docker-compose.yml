# VR-освіта: cp .env.docker.example .env.app && docker compose up -d --build  →  http://<сервер>:8095/admin
# Імена сервісів з префіксом xr-, бо на живому сервері nginx підключено ще й до мережі музейного порталу.
services:
  edu-app:
    build: .
    image: education-xr-app:latest   # на живому сервері образ збирає GitHub Actions
    restart: unless-stopped
    env_file: ./.env.app
    environment:
      RUN_MIGRATIONS: "1"
    volumes:
      - storage:/var/www/html/storage/app
      - public:/var/www/public-shared
    depends_on:
      edu-db: { condition: service_healthy }

  edu-queue:                        # SHA-256 білдів та інші фонові задачі
    image: education-xr-app:latest
    restart: unless-stopped
    env_file: ./.env.app
    command: php artisan queue:work --tries=2 --timeout=3600 --max-time=3600
    volumes: [storage:/var/www/html/storage/app]
    depends_on: [edu-app]

  edu-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8095}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - public:/var/www/html/public:ro
      - storage:/var/www/html/storage/app:ro
    depends_on: [edu-app]

  edu-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vrosvita
      POSTGRES_USER: vrosvita
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vrosvita"]
      interval: 5s
      retries: 20

volumes:
  storage:
  public:
  dbdata:
